name: Publish Image

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine image tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=v2.2.0" >> "$GITHUB_ENV"
          else
            tag=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/[:upper:]' '-[:lower:]')
            echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          nix run --impure .#push-images -- ghcr.io/lorenzbischof/crossplane-gke-issue
